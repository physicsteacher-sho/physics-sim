<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>運動エネルギー | 物理基礎</title>
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --bg:#f8fafc; --card:#fff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --blue:#1d4ed8; --blue-dark:#0f2f7a; --blue-soft:#eff6ff;
    --green:#15803d; --orange:#ea580c; --orange-soft:#fff7ed;
    --purple:#7c3aed; --red:#dc2626;
  }
  body { background:var(--bg); color:var(--text); font-family:"Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif; padding:20px; min-height:100vh; }
  h1 { text-align:center; font-size:24px; font-weight:900; color:var(--blue-dark); margin-bottom:4px; }
  .subtitle { text-align:center; font-size:13px; color:var(--muted); font-weight:700; margin-bottom:22px; }
  .layout { max-width:1080px; margin:0 auto; display:grid; grid-template-columns:1fr 300px; gap:18px; }
  .main-col { display:flex; flex-direction:column; gap:14px; }
  .side-col  { display:flex; flex-direction:column; gap:14px; position:sticky; top:20px; align-self:start; max-height:calc(100vh - 40px); overflow-y:auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:0 4px 16px rgba(15,23,42,0.06); overflow:hidden; }
  .card-header { display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); }
  .badge { width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; color:white; flex-shrink:0; }
  .card-title { font-size:15px; font-weight:900; color:var(--blue-dark); flex:1; }
  .card-sub   { font-size:12px; color:var(--muted); }
  canvas { display:block; width:100%; }
  .side-col .card { padding:16px; }
  .ctrl-section { display:flex; flex-direction:column; gap:14px; }
  .ctrl-section h3 { font-size:14px; font-weight:900; color:var(--blue-dark); padding-bottom:8px; border-bottom:1px solid var(--line); }
  .control { display:flex; flex-direction:column; gap:5px; }
  .control label { display:flex; justify-content:space-between; font-size:13px; font-weight:700; }
  .val { background:#f1f5f9; border:1px solid var(--line); border-radius:8px; padding:1px 8px; font-size:12px; font-weight:700; min-width:60px; text-align:right; }
  input[type=range] { width:100%; accent-color:var(--blue); }
  .range-hint { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); font-weight:600; }
  .toggle { display:grid; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .toggle.two { grid-template-columns:1fr 1fr; }
  .toggle button { border:0; padding:8px 4px; font-size:11px; font-weight:700; cursor:pointer; background:#f1f5f9; color:#475569; font-family:inherit; }
  .toggle button.active { background:var(--blue); color:white; }
  .formula-box { background:var(--blue-soft); border:1px solid #bfdbfe; border-radius:12px; padding:12px 14px; font-size:13px; font-weight:700; line-height:1.9; }
  .formula-box strong { color:var(--blue-dark); display:block; margin-bottom:4px; }
  .result-card { border-radius:12px; padding:12px 14px; font-size:13px; font-weight:900; line-height:1.9; }
  .info-half { border-radius:10px; padding:12px 14px; font-size:12px; font-weight:700; line-height:1.8; }
  .hl { border-radius:4px; padding:1px 6px; font-weight:900; }
  .hl-blue   { background:#dbeafe; color:#1e40af; }
  .hl-green  { background:#dcfce7; color:#166534; }
  .hl-orange { background:#ffedd5; color:#9a3412; }
</style>
</head>
<body>
<h1>運動エネルギー</h1>
<p class="subtitle">物理基礎 14 ｜ K = ½mv²　　½mv² − ½mv₀² = W</p>

<div class="layout">
  <div class="main-col">
    <div class="card">
      <div class="card-header">
        <div class="badge" id="mainBadge" style="background:linear-gradient(135deg,#1e40af,#3b82f6)">K</div>
        <span class="card-title" id="mainTitle">運動エネルギー</span>
        <span class="card-sub" id="mainSub">K = ½mv²</span>
      </div>
      <canvas id="mainCanvas" height="170"></canvas>
    </div>
    <div class="info-half" style="background:var(--blue-soft);border:1px solid #bfdbfe;">
      <strong style="color:var(--blue-dark)" id="infoTitle">運動エネルギー</strong>
      <span id="infoBody"><span class="hl hl-blue">K = ½mv²</span>。質量に比例し、速さの<span class="hl hl-orange">2乗に比例</span>する。速さが2倍になるとKは4倍。</span>
    </div>
  </div>

  <div class="side-col">
    <div class="card">
      <div class="ctrl-section">
        <div>
          <h3>場面</h3>
          <div class="toggle two" style="margin-top:10px">
            <button id="tab1" class="active" onclick="setTab('kinetic')">運動エネルギー</button>
            <button id="tab2" onclick="setTab('workenergy')">仕事との関係</button>
          </div>
        </div>

        <div id="kineticCtrls">
          <div class="control">
            <label>質量 m <span class="val" id="m-label">3.0 kg</span></label>
            <input type="range" id="m-slider" min="0.5" max="10" value="3" step="0.5">
            <div class="range-hint"><span>0.5 kg</span><span>10 kg</span></div>
          </div>
          <div class="control">
            <label>速さ v <span class="val" id="v-label">4.0 m/s</span></label>
            <input type="range" id="v-slider" min="0" max="10" value="4" step="0.5">
            <div class="range-hint"><span>0 m/s</span><span>10 m/s</span></div>
          </div>
        </div>

        <div id="workenergyCtrls" style="display:none">
          <div class="control">
            <label>質量 m <span class="val" id="mw-label">2.0 kg</span></label>
            <input type="range" id="mw-slider" min="0.5" max="10" value="2" step="0.5">
            <div class="range-hint"><span>0.5 kg</span><span>10 kg</span></div>
          </div>
          <div class="control">
            <label>初速度 v₀ <span class="val" id="v0-label">2.0 m/s</span></label>
            <input type="range" id="v0-slider" min="0" max="8" value="2" step="0.5">
            <div class="range-hint"><span>0 m/s</span><span>8 m/s</span></div>
          </div>
          <div class="control">
            <label>力 F <span class="val" id="Fw-label">10 N</span></label>
            <input type="range" id="Fw-slider" min="0" max="40" value="10" step="1">
            <div class="range-hint"><span>0 N</span><span>40 N</span></div>
          </div>
          <div class="control">
            <label>移動距離 x <span class="val" id="xw-label">4.0 m</span></label>
            <input type="range" id="xw-slider" min="0.5" max="10" value="4" step="0.5">
            <div class="range-hint"><span>0.5 m</span><span>10 m</span></div>
          </div>
        </div>

        <div class="formula-box" id="formulaBox">
          <strong>運動エネルギー</strong>
          K = ½mv²<br>
          <span style="color:var(--muted);font-size:11px">単位：J（ジュール）</span>
        </div>
        <div class="result-card" id="resultCard" style="background:var(--orange-soft);border:1px solid #fed7aa;color:var(--orange)">
          K = 24.0 J
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const DPR = window.devicePixelRatio || 1;
let tab = 'kinetic';
let animId = null, animX = 0, lastTs = null;

const CVS = document.getElementById('mainCanvas');
function resizeC(){
  const r=CVS.getBoundingClientRect(); if(!r.width) return;
  CVS.width=r.width*DPR; CVS.height=r.height*DPR;
  CVS.getContext('2d').setTransform(DPR,0,0,DPR,0,0);
}
resizeC();
window.addEventListener('resize',()=>{ resizeC(); redraw(); });

function arrow(ctx,x1,y1,x2,y2,color,lw){
  const dx=x2-x1,dy=y2-y1,len=Math.sqrt(dx*dx+dy*dy);
  if(len<4) return;
  ctx.save(); ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=lw||3;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  const ang=Math.atan2(dy,dx),hs=11;
  ctx.beginPath(); ctx.moveTo(x2,y2);
  ctx.lineTo(x2-hs*Math.cos(ang-0.4),y2-hs*Math.sin(ang-0.4));
  ctx.lineTo(x2-hs*Math.cos(ang+0.4),y2-hs*Math.sin(ang+0.4));
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function dot(ctx,x,y,color){
  ctx.save(); ctx.fillStyle=color;
  ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.fill(); ctx.restore();
}
function lbl(ctx,x,y,text,color,align,base){
  ctx.save(); ctx.fillStyle=color||'#334155';
  ctx.font='700 12px Hiragino Sans,system-ui';
  ctx.textAlign=align||'center'; ctx.textBaseline=base||'alphabetic';
  ctx.fillText(text,x,y); ctx.restore();
}
function ground(ctx,W,H,gy){
  ctx.fillStyle='#e2e8f0'; ctx.fillRect(0,gy,W,H-gy);
  ctx.strokeStyle='#94a3b8'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke();
}
function block(ctx,cx,gy,bw,bh,color){
  ctx.save();
  ctx.fillStyle=color||'#dbeafe'; ctx.strokeStyle='#1d4ed8'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.roundRect(cx-bw/2,gy-bh,bw,bh,6); ctx.fill(); ctx.stroke();
  ctx.restore();
}

// ===== 運動エネルギー =====
function drawKinetic(cx_override){
  const ctx=CVS.getContext('2d');
  const W=CVS.getBoundingClientRect().width, H=CVS.getBoundingClientRect().height;
  ctx.clearRect(0,0,W,H); ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);

  const m=parseFloat(document.getElementById('m-slider').value);
  const v=parseFloat(document.getElementById('v-slider').value);
  const K=0.5*m*v*v;

  const gy=H*0.65, bw=60, bh=44;
  ground(ctx,W,H,gy);

  const cx = cx_override !== undefined ? cx_override : W*0.35;

  block(ctx,cx,gy,bw,bh);

  // 速度矢印（上面）
  if(v>0.1){
    const vLen=Math.min(v*12,100);
    arrow(ctx,cx-bw/2,gy-bh-18, cx-bw/2+vLen,gy-bh-18,'#1d4ed8',2.5);
    lbl(ctx,cx-bw/2+vLen+6,gy-bh-14,`v = ${v} m/s`,'#1d4ed8','left');
  } else {
    lbl(ctx,cx,gy-bh-18,'v = 0（静止）','#64748b','center');
  }

  // 質量ラベル
  lbl(ctx,cx,gy-bh/2-2,`m = ${m} kg`,'#1e40af','center','middle');

  // 計算式
  ctx.save(); ctx.fillStyle='#15803d'; ctx.font='700 18px Hiragino Sans,system-ui';
  ctx.textAlign='center';
  ctx.fillText(`K = ½mv² = ½ × ${m} × ${v}² = ${K.toFixed(1)} J`, W/2, H-10);
  ctx.restore();
}

// ===== 仕事と運動エネルギーの関係 =====
function drawWorkEnergy(cx_override){
  const ctx=CVS.getContext('2d');
  const W=CVS.getBoundingClientRect().width, H=CVS.getBoundingClientRect().height;
  ctx.clearRect(0,0,W,H); ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);

  const m=parseFloat(document.getElementById('mw-slider').value);
  const v0=parseFloat(document.getElementById('v0-slider').value);
  const F=parseFloat(document.getElementById('Fw-slider').value);
  const x=parseFloat(document.getElementById('xw-slider').value);
  const W_work=F*x;
  const v2=Math.sqrt(Math.max(0, v0*v0+2*W_work/m));
  const K0=0.5*m*v0*v0;
  const K2=0.5*m*v2*v2;

  const gy=H*0.78, bw=56, bh=40;
  ground(ctx,W,H,gy);

  // 注釈（上部）
  ctx.save();
  ctx.fillStyle='#94a3b8'; ctx.font='700 11px Hiragino Sans,system-ui'; ctx.textAlign='center';
  ctx.fillText('※ 概念理解のため、アニメの移動時間は一定に正規化しています', W/2, 16);
  ctx.restore();

  // 左端（初期状態）・右端（終状態）の位置
  const leftX=W*0.14, rightX=W*0.82;
  const midX=(leftX+rightX)/2;

  // ===== 初期状態（左）=====
  // ゴーストブロック（薄い）
  ctx.save(); ctx.globalAlpha=0.3;
  block(ctx,leftX,gy,bw,bh,'#dbeafe');
  ctx.restore();
  // K₀ ボックス
  ctx.save();
  ctx.fillStyle='#eff6ff'; ctx.strokeStyle='#bfdbfe'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.roundRect(leftX-46,gy-bh-64,92,48,8); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#1e40af'; ctx.font='700 11px Hiragino Sans,system-ui'; ctx.textAlign='center';
  ctx.fillText('初期状態',leftX,gy-bh-50);
  ctx.fillStyle='#1d4ed8'; ctx.font='900 13px Hiragino Sans,system-ui';
  ctx.fillText(`K₀ = ½mv₀²`,leftX,gy-bh-34);
  ctx.fillStyle='#ea580c'; ctx.font='700 13px Hiragino Sans,system-ui';
  ctx.fillText(`= ${K0.toFixed(1)} J`,leftX,gy-bh-18);
  ctx.restore();
  // v₀矢印
  if(v0>0.1){
    const vLen=Math.min(v0*10,50);
    arrow(ctx,leftX-bw/2,gy-bh-8, leftX-bw/2+vLen,gy-bh-8,'#64748b',2);
    lbl(ctx,leftX-bw/2+vLen+4,gy-bh-4,`v₀=${v0}m/s`,'#64748b','left');
  } else {
    lbl(ctx,leftX,gy-bh-8,'v₀ = 0','#64748b','center');
  }

  // ===== 中央：仕事の矢印 =====
  arrow(ctx,leftX+bw/2+10,gy-bh/2, rightX-bw/2-10,gy-bh/2,'#ea580c',2.5);
  // W = Fx ボックス
  ctx.save();
  ctx.fillStyle='#fff7ed'; ctx.strokeStyle='#fed7aa'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.roundRect(midX-52,gy-bh-52,104,42,8); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#9a3412'; ctx.font='700 11px Hiragino Sans,system-ui'; ctx.textAlign='center';
  ctx.fillText('された仕事',midX,gy-bh-38);
  ctx.fillStyle='#ea580c'; ctx.font='900 14px Hiragino Sans,system-ui';
  ctx.fillText(`W = Fx = ${W_work.toFixed(1)} J`,midX,gy-bh-20);
  ctx.restore();
  // x矢印（地面）
  ctx.save(); ctx.strokeStyle='#94a3b8'; ctx.lineWidth=1; ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(leftX,gy+14); ctx.lineTo(rightX,gy+14); ctx.stroke();
  ctx.setLineDash([]); ctx.restore();
  arrow(ctx,leftX,gy+14,rightX,gy+14,'#94a3b8',1.5);
  lbl(ctx,midX,gy+26,`x = ${x} m`,'#94a3b8','center');

  // ===== 終状態（右）=====
  ctx.save(); ctx.globalAlpha=0.3;
  block(ctx,rightX,gy,bw,bh,'#dcfce7');
  ctx.restore();
  // K ボックス
  ctx.save();
  ctx.fillStyle='#f0fdf4'; ctx.strokeStyle='#bbf7d0'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.roundRect(rightX-46,gy-bh-64,92,48,8); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#166534'; ctx.font='700 11px Hiragino Sans,system-ui'; ctx.textAlign='center';
  ctx.fillText('終状態',rightX,gy-bh-50);
  ctx.fillStyle='#15803d'; ctx.font='900 13px Hiragino Sans,system-ui';
  ctx.fillText(`K = ½mv²`,rightX,gy-bh-34);
  ctx.fillStyle='#ea580c'; ctx.font='700 13px Hiragino Sans,system-ui';
  ctx.fillText(`= ${K2.toFixed(1)} J`,rightX,gy-bh-18);
  ctx.restore();
  // v矢印
  if(v2>0.1){
    const vLen=Math.min(v2*10,60);
    arrow(ctx,rightX-bw/2,gy-bh-8, rightX-bw/2+vLen,gy-bh-8,'#15803d',2);
    lbl(ctx,rightX-bw/2+vLen+4,gy-bh-4,`v=${v2.toFixed(1)}m/s`,'#15803d','left');
  }

  // ===== 動く物体 =====
  if(cx_override !== undefined){
    const progress=Math.min((cx_override-leftX)/(rightX-leftX),1);
    const curV=v0+(v2-v0)*progress;
    block(ctx,cx_override,gy,bw,bh,'#fef9c3');
    if(F>0.1){
      const fLen=Math.min(F*1.2,60);
      dot(ctx,cx_override+bw/2,gy-bh/2,'#7c3aed');
      arrow(ctx,cx_override+bw/2,gy-bh/2, cx_override+bw/2+fLen,gy-bh/2,'#7c3aed',2.5);
      lbl(ctx,cx_override+bw/2+fLen/2,gy-bh/2-12,`F=${F}N`,'#7c3aed','center');
    }
  }

  // ===== 関係式（下部）=====
  ctx.save();
  ctx.fillStyle='#15803d'; ctx.font='700 17px Hiragino Sans,system-ui'; ctx.textAlign='center';
  ctx.fillText(`½mv² − ½mv₀² = ${K2.toFixed(1)} − ${K0.toFixed(1)} = ${(K2-K0).toFixed(1)} J = W`, W/2, H-10);
  ctx.restore();
}

// ===== アニメ =====
function startAnim(){
  if(animId) cancelAnimationFrame(animId);
  animX=0; lastTs=null;
  function loop(ts){
    if(!lastTs) lastTs=ts;
    const dt=Math.min((ts-lastTs)/1000,0.05); lastTs=ts;
    const W2=CVS.getBoundingClientRect().width;

    if(tab==='kinetic'){
      const v=parseFloat(document.getElementById('v-slider').value);
      const bw=60, startX=W2*0.1+bw/2;
      animX+=v*dt*30;
      if(startX+animX > W2-bw/2-8) animX=0;
      drawKinetic(startX+animX);
    } else {
      const W2=CVS.getBoundingClientRect().width;
      const v0=parseFloat(document.getElementById('v0-slider').value);
      const F=parseFloat(document.getElementById('Fw-slider').value);
      const m=parseFloat(document.getElementById('mw-slider').value);
      const x=parseFloat(document.getElementById('xw-slider').value);
      const leftX=W2*0.14, rightX=W2*0.82;
      const rangeX=rightX-leftX;
      const a=F/m;
      // 実際の移動時間Tを計算してアニメを2.5秒に正規化
      let T;
      if(a>0.01) T=(-v0+Math.sqrt(Math.max(0,v0*v0+2*a*x)))/a;
      else if(v0>0.01) T=x/v0;
      else T=3;
      const scale=T/2.5; // 2.5秒で渡りきる
      animX+=dt;
      const physT=animX*scale; // 物理時間
      const dist=v0*physT+0.5*a*physT*physT;
      const cx=leftX+(Math.min(dist,x)/x)*rangeX;
      if(animX>2.6){ animX=0; }
      drawWorkEnergy(cx);
    }
    animId=requestAnimationFrame(loop);
  }
  animId=requestAnimationFrame(loop);
}

function stopAnim(){
  if(animId){ cancelAnimationFrame(animId); animId=null; }
}

// ===== UI =====
function updateUI(){
  if(tab==='kinetic'){
    const m=parseFloat(document.getElementById('m-slider').value);
    const v=parseFloat(document.getElementById('v-slider').value);
    const K=0.5*m*v*v;
    document.getElementById('mainTitle').textContent='運動エネルギー';
    document.getElementById('mainSub').textContent='K = ½mv²';
    document.getElementById('formulaBox').innerHTML='<strong>運動エネルギー</strong>K = ½mv²<br><span style="color:var(--muted);font-size:11px">mに比例、vの2乗に比例</span>';
    document.getElementById('resultCard').textContent=`K = ${K.toFixed(1)} J`;
    document.getElementById('infoTitle').textContent='運動エネルギー';
    document.getElementById('infoBody').innerHTML='<span class="hl hl-blue">K = ½mv²</span>。質量に比例し、速さの<span class="hl hl-orange">2乗に比例</span>する。速さが2倍になるとKは4倍。';
  } else {
    const m=parseFloat(document.getElementById('mw-slider').value);
    const v0=parseFloat(document.getElementById('v0-slider').value);
    const F=parseFloat(document.getElementById('Fw-slider').value);
    const x=parseFloat(document.getElementById('xw-slider').value);
    const W_work=F*x;
    const v2=Math.sqrt(Math.max(0, v0*v0+2*W_work/m));
    const K0=0.5*m*v0*v0, K2=0.5*m*v2*v2;
    document.getElementById('mainTitle').textContent='仕事と運動エネルギーの関係';
    document.getElementById('mainSub').textContent='½mv² − ½mv₀² = W';
    document.getElementById('formulaBox').innerHTML='<strong>仕事と運動エネルギーの関係</strong>½mv² − ½mv₀² = W<br><span style="color:var(--muted);font-size:11px">運動エネルギーの変化 = された仕事</span>';
    document.getElementById('resultCard').innerHTML=`K₀ = ${K0.toFixed(1)} J → K = ${K2.toFixed(1)} J<br>ΔK = ${(K2-K0).toFixed(1)} J = W`;
    document.getElementById('infoTitle').textContent='仕事と運動エネルギーの関係';
    document.getElementById('infoBody').innerHTML='<span class="hl hl-blue">½mv² − ½mv₀² = W</span>。力がした仕事の分だけ運動エネルギーが変化する。F=0なら等速（Kは変化しない）。';
  }
}

function redraw(){
  updateUI();
  if(tab==='kinetic') drawKinetic();
  else drawWorkEnergy();
}

function setTab(t){
  tab=t; stopAnim(); animX=0;
  document.getElementById('tab1').classList.toggle('active',t==='kinetic');
  document.getElementById('tab2').classList.toggle('active',t==='workenergy');
  document.getElementById('kineticCtrls').style.display=t==='kinetic'?'contents':'none';
  document.getElementById('workenergyCtrls').style.display=t==='workenergy'?'contents':'none';
  setTimeout(()=>{ resizeC(); updateUI(); startAnim(); },30);
}

[['m','m-label',v=>parseFloat(v).toFixed(1)+' kg'],
 ['v','v-label',v=>parseFloat(v).toFixed(1)+' m/s'],
 ['mw','mw-label',v=>parseFloat(v).toFixed(1)+' kg'],
 ['v0','v0-label',v=>parseFloat(v).toFixed(1)+' m/s'],
 ['Fw','Fw-label',v=>v+' N'],
 ['xw','xw-label',v=>parseFloat(v).toFixed(1)+' m'],
].forEach(([name,labelId,fmt])=>{
  const el=document.getElementById(name+'-slider');
  el.addEventListener('input',()=>{
    document.getElementById(labelId).textContent=fmt(el.value);
    updateUI(); startAnim();
  });
});

setTimeout(()=>{ resizeC(); updateUI(); startAnim(); },50);
</script>
</body>
</html>
