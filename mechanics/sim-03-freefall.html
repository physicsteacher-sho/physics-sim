<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自由落下・鉛直投射 | 物理シミュレーション</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0d1117; --surface:#161b22; --surface2:#1c2330;
    --border:#2a3441; --blue:#2f81f7; --blue-dim:#1a4a8a;
    --blue-glow:rgba(47,129,247,0.15); --green:#3fb950;
    --orange:#e07b39; --pink:#d2a8ff; --yellow:#f7c948;
    --text:#e6edf3; --text-muted:#7d8590; --text-dim:#2a3441;
    --mono:'JetBrains Mono',monospace; --sans:'Noto Sans JP',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);height:100vh;overflow:hidden;}

  .sim-header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 32px;display:flex;align-items:center;gap:16px;}
  .sim-badge{background:var(--blue-dim);color:var(--blue);font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;padding:4px 10px;border-radius:4px;border:1px solid var(--blue-dim);text-transform:uppercase;}
  .sim-title{font-size:18px;font-weight:700;}
  .sim-subtitle{font-size:12px;color:var(--text-muted);margin-left:auto;font-family:var(--mono);}
  .btn-fullscreen{margin-left:12px;background:var(--surface2);color:var(--text-muted);border:1px solid var(--border);border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;}

  .sim-body{display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 53px);}

  .sim-panel{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
  .tab-bar{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--border);}
  .tab-btn{background:transparent;color:var(--text-muted);border:none;border-bottom:2px solid transparent;padding:12px 0;font-family:var(--sans);font-size:13px;cursor:pointer;}
  .tab-btn.active{color:var(--blue);border-bottom-color:var(--blue);}
  .tab-content{display:none;padding:20px;flex-direction:column;gap:16px;overflow-y:auto;flex:1;}
  .tab-content.active{display:flex;}

  .panel-section-label{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.12em;color:var(--text-dim);text-transform:uppercase;margin-bottom:10px;}
  .slider-group{display:flex;flex-direction:column;gap:14px;}
  .slider-row{display:flex;flex-direction:column;gap:6px;}
  .slider-header{display:flex;justify-content:space-between;align-items:baseline;}
  .slider-label{font-size:13px;color:var(--text-muted);}
  .slider-label em{font-style:normal;font-family:var(--mono);color:var(--text);font-size:12px;}
  .slider-value{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--blue);}
  input[type=range]{-webkit-appearance:none;width:100%;height:4px;background:var(--border);border-radius:2px;outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--blue);cursor:pointer;box-shadow:0 0 0 3px var(--blue-glow);}
  input[type=range]:disabled{opacity:.4;pointer-events:none;}

  .btn-group{display:flex;flex-direction:column;gap:8px;}
  .btn{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:9px 14px;font-family:var(--sans);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .15s,border-color .15s;}
  .btn:hover{background:var(--blue-glow);border-color:var(--blue);}
  .btn:disabled{opacity:.4;pointer-events:none;}
  .btn-start{background:var(--blue-dim);border-color:var(--blue);justify-content:center;font-weight:700;font-size:14px;padding:11px;}
  .btn-start:hover{background:var(--blue);}
  .btn-reset{background:transparent;color:var(--text-muted);border-color:var(--border);font-size:12px;justify-content:center;}
  .btn-reset:hover{color:var(--text);background:var(--surface2);}
  .btn-toggle{justify-content:space-between;}
  .btn-toggle.on{background:var(--blue-glow);border-color:var(--blue);}
  .toggle-pip{width:28px;height:16px;border-radius:8px;background:var(--border);position:relative;transition:background .2s;flex-shrink:0;}
  .btn-toggle.on .toggle-pip{background:var(--blue);}
  .toggle-pip::after{content:'';position:absolute;width:10px;height:10px;border-radius:50%;background:#fff;top:3px;left:3px;transition:left .2s;}
  .btn-toggle.on .toggle-pip::after{left:15px;}

  .mode-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
  .mode-btn{background:var(--surface2);color:var(--text-muted);border:1px solid var(--border);border-radius:6px;padding:8px 6px;font-size:12px;cursor:pointer;text-align:center;transition:all .15s;}
  .mode-btn.active{background:var(--blue-dim);color:var(--blue);border-color:var(--blue);}

  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .metric-card{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;}
  .metric-label{font-family:var(--mono);font-size:10px;color:var(--text-muted);margin-bottom:4px;}
  .metric-value{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--text);}

  .hint-box{background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--blue);border-radius:6px;padding:12px 14px;font-family:var(--mono);font-size:12px;color:var(--text-muted);line-height:1.8;white-space:pre-line;}

  .sim-right{display:grid;grid-template-columns:1fr 1fr;overflow:hidden;}
  .sim-canvas-area{background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;}
  .sim-canvas-area:first-child{border-right:1px solid var(--border);}
  canvas{display:block;border-radius:6px;border:1px solid var(--border);}
</style>
</head>
<body>

<header class="sim-header">
  <span class="sim-badge">力学 03</span>
  <h1 class="sim-title">自由落下・鉛直投射</h1>
  <span class="sim-subtitle">Physics Simulation</span>
  <button class="btn-fullscreen" onclick="toggleFullscreen()">⛶ 全画面</button>
</header>

<div class="sim-body">
  <aside class="sim-panel">
    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('tab-settings',this)">設定</button>
      <button class="tab-btn" onclick="switchTab('tab-display',this)">表示</button>
    </div>

    <div class="tab-content active" id="tab-settings">
      <div>
        <div class="panel-section-label">モード</div>
        <div class="mode-btns">
          <button class="mode-btn active" id="mode-free" onclick="setMode('free')">自由落下</button>
          <button class="mode-btn" id="mode-up" onclick="setMode('up')">上向き投射</button>
          <button class="mode-btn" id="mode-down" onclick="setMode('down')">下向き投射</button>
        </div>
      </div>

      <div>
        <div class="panel-section-label">初期条件</div>
        <div class="slider-group">
          <div class="slider-row">
            <div class="slider-header">
              <span class="slider-label"><em>y₀</em>　初期高さ (m)</span>
              <span class="slider-value" id="y0-label">30.0</span>
            </div>
            <input type="range" id="y0-slider" min="10" max="80" value="30" step="1">
          </div>
          <div class="slider-row" id="v0-row">
            <div class="slider-header">
              <span class="slider-label"><em>v₀</em>　初速度 (m/s)</span>
              <span class="slider-value" id="v0-label">15.0</span>
            </div>
            <input type="range" id="v0-slider" min="1" max="30" value="15" step="0.5">
          </div>
        </div>
      </div>

      <div>
        <div class="panel-section-label">再生</div>
        <div class="btn-group">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <button class="btn btn-start" id="btn-start" onclick="startAnim()">▶ 開始</button>
            <button class="btn" id="btn-pause" onclick="togglePause()" disabled style="justify-content:center;">⏸ 停止</button>
          </div>
          <div class="slider-row">
            <div class="slider-header">
              <span class="slider-label">再生速度</span>
              <span class="slider-value" id="speed-label">1.0x</span>
            </div>
            <input type="range" id="speed-slider" min="0.1" max="3" value="1" step="0.1">
          </div>
          <button class="btn btn-reset" onclick="resetAll()">リセット</button>
        </div>
      </div>

      <div>
        <div class="panel-section-label">計測値</div>
        <div class="metrics">
          <div class="metric-card">
            <div class="metric-label">時刻 t (s)</div>
            <div class="metric-value" id="m-t">—</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">高さ y (m)</div>
            <div class="metric-value" id="m-y">—</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">速度 v (m/s)</div>
            <div class="metric-value" id="m-v">—</div>
          </div>
          <div class="metric-card">
            <div class="metric-label">落下距離 (m)</div>
            <div class="metric-value" id="m-d">—</div>
          </div>
        </div>
      </div>

      <div class="hint-box" id="hint-box">モードと初期条件を設定して\n▶ 開始 を押してみよう。</div>
    </div>

    <div class="tab-content" id="tab-display">
      <div>
        <div class="panel-section-label">表示切替</div>
        <div class="btn-group">
          <button class="btn btn-toggle on" id="btn-vel" onclick="toggleFlag('showVel','btn-vel')">
            速度ベクトル<span class="toggle-pip"></span>
          </button>
          <button class="btn btn-toggle on" id="btn-peak" onclick="toggleFlag('showPeak','btn-peak')">
            最高点マーカー<span class="toggle-pip"></span>
          </button>
          <button class="btn btn-toggle on" id="btn-ground" onclick="toggleFlag('showGround','btn-ground')">
            地面<span class="toggle-pip"></span>
          </button>
        </div>
      </div>
    </div>
  </aside>

  <div class="sim-right">
    <!-- 左：アニメーション -->
    <div class="sim-canvas-area">
      <canvas id="main-canvas"></canvas>
    </div>
    <!-- 右：y-tグラフ & v-tグラフ -->
    <div style="display:grid;grid-template-rows:1fr 1fr;overflow:hidden;border-left:0;">
      <div style="padding:16px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg);">
        <div style="font-family:var(--mono);font-size:11px;color:var(--text-muted);margin-bottom:8px;">y-t グラフ（高さ－時刻）</div>
        <canvas id="yt-canvas"></canvas>
      </div>
      <div style="padding:16px;display:flex;flex-direction:column;background:var(--bg);">
        <div style="font-family:var(--mono);font-size:11px;color:var(--text-muted);margin-bottom:8px;">v-t グラフ（速度－時刻）　↑上向き正</div>
        <canvas id="vt-canvas"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
const G = 9.8;
const flags = {showVel:true, showPeak:true, showGround:true};
let mode = 'free'; // free | up | down
let state = 'idle', animId = null, paused = false;
let animT = 0, animSpeed = 1.0, startTime = null, savedT = 0;
let trail = [];

const C = {
  bg:'#0d1117', border:'#2a3441', blue:'#2f81f7',
  green:'#3fb950', orange:'#e07b39', yellow:'#f7c948', pink:'#d2a8ff',
  text:'#e6edf3', muted:'#7d8590', dim:'#2a3441', axis:'rgba(255,255,255,0.15)',
};

function resizeCanvases(){
  const right = document.querySelector('.sim-right');
  const W = right.clientWidth, H = right.clientHeight;
  const mc = document.getElementById('main-canvas');
  mc.width = Math.floor(W/2)-32;
  mc.height = H-32;
  const gw = Math.floor(W/2)-32, gh = Math.floor(H/2)-48;
  document.getElementById('yt-canvas').width = gw;
  document.getElementById('yt-canvas').height = gh;
  document.getElementById('vt-canvas').width = gw;
  document.getElementById('vt-canvas').height = gh;
}
resizeCanvases();

function get(){
  const y0 = parseFloat(document.getElementById('y0-slider').value);
  const v0raw = parseFloat(document.getElementById('v0-slider').value);
  const v0 = mode==='free' ? 0 : mode==='up' ? v0raw : -v0raw;
  return {y0, v0};
}

function yAt(y0,v0,t){ return y0 + v0*t - 0.5*G*t*t; }
function vAt(v0,t){ return v0 - G*t; }
function tLand(y0,v0){
  // y0 + v0*t - 0.5*G*t^2 = 0
  const disc = v0*v0 + 2*G*y0;
  if(disc < 0) return 0;
  return (v0 + Math.sqrt(disc)) / G;
}
function tPeak(v0){ return v0 > 0 ? v0/G : 0; }

function setMode(m){
  mode = m;
  ['free','up','down'].forEach(id=>{
    document.getElementById('mode-'+id).classList.toggle('active', id===m);
  });
  document.getElementById('v0-row').style.opacity = m==='free' ? '0.3' : '1';
  document.getElementById('v0-slider').disabled = m==='free';
  resetAll();
}

function switchTab(id,btn){
  document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(e=>e.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}
function toggleFlag(flag,btnId){
  flags[flag]=!flags[flag];
  document.getElementById(btnId).classList.toggle('on',flags[flag]);
  if(state!=='running') drawAll();
}
function toggleFullscreen(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}

function updateMetrics(y0,v0,t){
  const y=yAt(y0,v0,t), v=vAt(v0,t);
  document.getElementById('m-t').textContent=t.toFixed(2);
  document.getElementById('m-y').textContent=Math.max(0,y).toFixed(2);
  document.getElementById('m-v').textContent=v.toFixed(2);
  document.getElementById('m-d').textContent=(y0-Math.max(0,y)).toFixed(2);
}

function resetAll(){
  if(animId){cancelAnimationFrame(animId);animId=null;}
  state='idle'; paused=false; animT=0; savedT=0; startTime=null; trail=[];
  document.getElementById('btn-start').textContent='▶ 開始';
  document.getElementById('btn-pause').disabled=true;
  document.getElementById('btn-pause').textContent='⏸ 停止';
  setSliderDisabled(false);
  const hints = {
    free:'自由落下：初速度ゼロで落下。\ny = y₀ - ½gt²',
    up:'上向き投射：最高点でv=0になってから落下。\nv = v₀ - gt',
    down:'下向き投射：初速度を下向きに与えて落下。\nv = -v₀ - gt'
  };
  document.getElementById('hint-box').textContent=hints[mode];
  ['m-t','m-y','m-v','m-d'].forEach(id=>document.getElementById(id).textContent='—');
  drawAll();
}

function setSliderDisabled(d){
  ['y0-slider'].forEach(id=>document.getElementById(id).disabled=d);
  if(mode!=='free') document.getElementById('v0-slider').disabled=d;
}

function startAnim(){
  if(state==='running') return;
  const {y0,v0}=get();
  const tEnd=tLand(y0,v0);
  state='running'; paused=false; animT=0; savedT=0; startTime=null; trail=[];
  setSliderDisabled(true);
  document.getElementById('btn-start').textContent='落下中...';
  document.getElementById('btn-pause').disabled=false;

  function step(ts){
    if(!startTime) startTime=ts;
    animT=Math.min(savedT+(ts-startTime)/1000*animSpeed, tEnd);
    const y=yAt(y0,v0,animT);
    trail.push({t:animT, y:Math.max(0,y)});
    updateMetrics(y0,v0,animT);
    drawAll();
    if(animT>=tEnd){
      state='done';
      document.getElementById('btn-start').textContent='▶ 開始';
      document.getElementById('btn-pause').disabled=true;
      setSliderDisabled(false);
      const tp=tPeak(v0);
      const yMax=tp>0?yAt(y0,v0,tp):y0;
      document.getElementById('hint-box').textContent=
        `落下時間: ${tEnd.toFixed(2)}s\n着地速度: ${Math.abs(vAt(v0,tEnd)).toFixed(2)}m/s`+
        (tp>0?`\n最高点: ${yMax.toFixed(1)}m (t=${tp.toFixed(2)}s)`:'');
      return;
    }
    animId=requestAnimationFrame(step);
  }
  animId=requestAnimationFrame(step);
}

function togglePause(){
  if(state!=='running') return;
  paused=!paused;
  const btn=document.getElementById('btn-pause');
  if(paused){
    btn.textContent='▶ 再開';
    if(animId){cancelAnimationFrame(animId);animId=null;}
    savedT=animT; startTime=null;
  } else {
    btn.textContent='⏸ 停止';
    const {y0,v0}=get();
    const tEnd=tLand(y0,v0);
    startTime=null;
    function resumeStep(ts){
      if(!startTime) startTime=ts;
      animT=Math.min(savedT+(ts-startTime)/1000*animSpeed,tEnd);
      const y=yAt(y0,v0,animT);
      trail.push({t:animT,y:Math.max(0,y)});
      updateMetrics(y0,v0,animT);
      drawAll();
      if(animT>=tEnd){
        state='done';
        document.getElementById('btn-start').textContent='▶ 開始';
        document.getElementById('btn-pause').disabled=true;
        setSliderDisabled(false);
        return;
      }
      animId=requestAnimationFrame(resumeStep);
    }
    animId=requestAnimationFrame(resumeStep);
  }
}

// ===== メインキャンバス（縦方向アニメーション）=====
function drawMain(){
  const canvas=document.getElementById('main-canvas');
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  const {y0,v0}=get();
  const tEnd=tLand(y0,v0);
  const yMax=tPeak(v0)>0 ? yAt(y0,v0,tPeak(v0)) : y0;
  const physMax=yMax*1.2+5;

  ctx.clearRect(0,0,W,H); ctx.fillStyle=C.bg; ctx.fillRect(0,0,W,H);

  const PAD={l:48,r:24,t:20,b:40};
  const gH=H-PAD.t-PAD.b;
  const scale=gH/physMax;
  const cx=W/2;

  function toSY(y){ return PAD.t+gH-y*scale; }

  // 地面
  if(flags.showGround){
    ctx.fillStyle='rgba(63,185,80,0.15)';
    ctx.fillRect(PAD.l, toSY(0), W-PAD.l-PAD.r, H-PAD.b-toSY(0)+PAD.b);
    ctx.strokeStyle=C.green; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(PAD.l,toSY(0)); ctx.lineTo(W-PAD.r,toSY(0)); ctx.stroke();
    ctx.fillStyle=C.green; ctx.font='11px "JetBrains Mono"'; ctx.textAlign='left';
    ctx.fillText('地面 (y=0)',PAD.l+6,toSY(0)-6);
  }

  // y軸
  ctx.strokeStyle=C.axis; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(PAD.l,PAD.t); ctx.lineTo(PAD.l,H-PAD.b); ctx.stroke();
  ctx.fillStyle=C.axis;
  ctx.beginPath(); ctx.moveTo(PAD.l,PAD.t); ctx.lineTo(PAD.l-4,PAD.t+10); ctx.lineTo(PAD.l+4,PAD.t+10); ctx.closePath(); ctx.fill();

  // y軸目盛り
  const tickStep=Math.ceil(physMax/6/5)*5;
  ctx.fillStyle=C.muted; ctx.font='11px "JetBrains Mono"'; ctx.textAlign='right';
  for(let y=0;y<=physMax;y+=tickStep){
    const sy=toSY(y);
    ctx.strokeStyle='rgba(255,255,255,0.06)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(PAD.l,sy); ctx.lineTo(W-PAD.r,sy); ctx.stroke();
    ctx.strokeStyle=C.axis;
    ctx.beginPath(); ctx.moveTo(PAD.l-4,sy); ctx.lineTo(PAD.l,sy); ctx.stroke();
    ctx.fillStyle=C.muted;
    ctx.fillText(y+'m',PAD.l-8,sy+4);
  }
  ctx.save(); ctx.translate(14,PAD.t+gH/2); ctx.rotate(-Math.PI/2);
  ctx.textAlign='center'; ctx.fillStyle=C.muted; ctx.font='12px "Noto Sans JP"';
  ctx.fillText('高さ y (m)',0,0); ctx.restore();

  const curY=(state==='idle')?y0:Math.max(0,yAt(y0,v0,animT));
  const curV=vAt(v0,animT);
  const sy=toSY(curY);

  // 軌跡（点線）
  if(state!=='idle'){
    ctx.strokeStyle='rgba(47,129,247,0.3)'; ctx.lineWidth=1.5; ctx.setLineDash([4,3]);
    ctx.beginPath();
    trail.forEach(({y},i)=>{
      if(i===0) ctx.moveTo(cx,toSY(y)); else ctx.lineTo(cx,toSY(y));
    });
    ctx.stroke(); ctx.setLineDash([]);
  }

  // 初期位置点線
  ctx.strokeStyle='rgba(247,201,72,0.4)'; ctx.lineWidth=1; ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(PAD.l,toSY(y0)); ctx.lineTo(W-PAD.r,toSY(y0)); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle=C.yellow; ctx.font='600 11px "JetBrains Mono"'; ctx.textAlign='left';
  ctx.fillText('y₀='+y0+'m',PAD.l+6,toSY(y0)-6);

  // 最高点マーカー
  if(flags.showPeak && tPeak(v0)>0){
    const yPk=yAt(y0,v0,tPeak(v0));
    const show = state==='idle'||state==='done'||(state==='running'&&animT>=tPeak(v0));
    if(show){
      ctx.strokeStyle=C.yellow; ctx.lineWidth=1; ctx.setLineDash([4,3]);
      ctx.beginPath(); ctx.moveTo(PAD.l,toSY(yPk)); ctx.lineTo(W-PAD.r,toSY(yPk)); ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(cx,toSY(yPk),5,0,Math.PI*2);
      ctx.fillStyle=C.yellow; ctx.fill();
      ctx.fillStyle=C.yellow; ctx.font='600 11px "JetBrains Mono"'; ctx.textAlign='left';
      ctx.fillText('最高点 '+yPk.toFixed(1)+'m',PAD.l+6,toSY(yPk)-6);
    }
  }

  // 速度ベクトル（キャンバス下端からはみ出ないよう長さを制限）
  if(flags.showVel&&(state==='running'||state==='done')){
    const dir=curV>=0?-1:1;
    const maxLen = dir>0 ? sy-PAD.t-10 : H-PAD.b-sy-10;
    const vLen=Math.min(80,Math.abs(curV)*4,Math.max(0,maxLen));
    const vx=cx-28;
    ctx.strokeStyle=C.green; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(vx,sy); ctx.lineTo(vx,sy+dir*vLen); ctx.stroke();
    ctx.fillStyle=C.green;
    if(vLen>8){
      ctx.beginPath(); ctx.moveTo(vx,sy+dir*vLen);
      ctx.lineTo(vx-5,sy+dir*vLen-dir*8); ctx.lineTo(vx+5,sy+dir*vLen-dir*8);
      ctx.closePath(); ctx.fill();
    }
    // ラベルは地面ラインより上に固定表示
    const groundSY = toSY(0);
    const labelY = Math.min(sy - 24, groundSY - 28);
    ctx.fillStyle=C.green; ctx.font='600 11px "JetBrains Mono"'; ctx.textAlign='center';
    ctx.fillText('v='+curV.toFixed(1)+'m/s', cx, Math.max(PAD.t+16, labelY));
  }

  // 質点
  ctx.beginPath(); ctx.arc(cx,sy,14,0,Math.PI*2);
  ctx.fillStyle=(curV>=0?C.blue:C.orange)+'33'; ctx.fill();
  ctx.beginPath(); ctx.arc(cx,sy,8,0,Math.PI*2);
  ctx.fillStyle=curV>=0?C.blue:C.orange; ctx.fill();
  ctx.beginPath(); ctx.arc(cx,sy,3,0,Math.PI*2);
  ctx.fillStyle='#fff'; ctx.fill();

  // 経過時間
  if(state==='running'||state==='done'){
    ctx.fillStyle='rgba(47,129,247,0.85)';
    ctx.beginPath(); ctx.roundRect(PAD.l+8,PAD.t+4,100,26,5); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='600 12px "JetBrains Mono"'; ctx.textAlign='left';
    ctx.fillText('t = '+animT.toFixed(2)+'s',PAD.l+16,PAD.t+22);
  }
}

// ===== y-tグラフ =====
function drawYT(){
  const canvas=document.getElementById('yt-canvas');
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  const {y0,v0}=get();
  const tEnd=tLand(y0,v0);
  const yMax=tPeak(v0)>0?yAt(y0,v0,tPeak(v0)):y0;

  ctx.clearRect(0,0,W,H); ctx.fillStyle=C.bg; ctx.fillRect(0,0,W,H);

  const PAD={l:44,r:16,t:12,b:28};
  const gW=W-PAD.l-PAD.r, gH=H-PAD.t-PAD.b;

  function sx(t){return PAD.l+t/tEnd*gW;}
  function sy(y){return PAD.t+gH-y/(yMax*1.15)*gH;}

  // グリッド
  ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    ctx.beginPath(); ctx.moveTo(PAD.l,PAD.t+i*gH/4); ctx.lineTo(W-PAD.r,PAD.t+i*gH/4); ctx.stroke();
  }

  // 軸
  ctx.strokeStyle=C.axis; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(PAD.l,PAD.t); ctx.lineTo(PAD.l,H-PAD.b); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(PAD.l,H-PAD.b); ctx.lineTo(W-PAD.r,H-PAD.b); ctx.stroke();

  ctx.fillStyle=C.muted; ctx.font='10px "JetBrains Mono"'; ctx.textAlign='center';
  ctx.fillText('0',sx(0),H-PAD.b+14);
  ctx.fillText(tEnd.toFixed(1)+'s',sx(tEnd),H-PAD.b+14);
  ctx.fillText('t(s)',W-PAD.r,H-PAD.b+14);
  ctx.textAlign='right';
  ctx.fillText(y0+'m',PAD.l-4,sy(y0)+4);
  if(tPeak(v0)>0) ctx.fillText(yAt(y0,v0,tPeak(v0)).toFixed(0)+'m',PAD.l-4,sy(yAt(y0,v0,tPeak(v0)))+4);
  ctx.save(); ctx.translate(12,PAD.t+gH/2); ctx.rotate(-Math.PI/2);
  ctx.textAlign='center'; ctx.fillText('y(m)',0,0); ctx.restore();

  // 全体曲線
  ctx.strokeStyle='rgba(47,129,247,0.2)'; ctx.lineWidth=1.5;
  ctx.beginPath();
  for(let i=0;i<=200;i++){
    const t=tEnd*i/200, y=Math.max(0,yAt(y0,v0,t));
    if(i===0) ctx.moveTo(sx(t),sy(y)); else ctx.lineTo(sx(t),sy(y));
  }
  ctx.stroke();

  // 軌跡
  if(trail.length>1){
    ctx.strokeStyle=C.blue; ctx.lineWidth=2;
    ctx.beginPath();
    trail.forEach(({t,y},i)=>{
      if(i===0) ctx.moveTo(sx(t),sy(y)); else ctx.lineTo(sx(t),sy(y));
    });
    ctx.stroke();
  }

  if(state==='running'||state==='done'){
    ctx.beginPath(); ctx.arc(sx(animT),sy(Math.max(0,yAt(y0,v0,animT))),4,0,Math.PI*2);
    ctx.fillStyle=C.blue; ctx.fill();
  }
}

// ===== v-tグラフ =====
function drawVT(){
  const canvas=document.getElementById('vt-canvas');
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  const {y0,v0}=get();
  const tEnd=tLand(y0,v0);
  const vEnd=vAt(v0,tEnd);
  let vMin=Math.min(v0,vEnd,0), vMax=Math.max(v0,vEnd,0);
  const vPad=Math.max((vMax-vMin)*0.15,3);
  vMin-=vPad; vMax+=vPad;

  ctx.clearRect(0,0,W,H); ctx.fillStyle=C.bg; ctx.fillRect(0,0,W,H);

  const PAD={l:44,r:16,t:12,b:28};
  const gW=W-PAD.l-PAD.r, gH=H-PAD.t-PAD.b;

  function sx(t){return PAD.l+t/tEnd*gW;}
  function sy(v){return PAD.t+gH-(v-vMin)/(vMax-vMin)*gH;}

  // グリッド
  ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    ctx.beginPath(); ctx.moveTo(PAD.l,PAD.t+i*gH/4); ctx.lineTo(W-PAD.r,PAD.t+i*gH/4); ctx.stroke();
  }

  // v=0ライン
  ctx.strokeStyle='rgba(255,255,255,0.2)'; ctx.setLineDash([4,3]);
  ctx.beginPath(); ctx.moveTo(PAD.l,sy(0)); ctx.lineTo(W-PAD.r,sy(0)); ctx.stroke();
  ctx.setLineDash([]);

  // 軸
  ctx.strokeStyle=C.axis; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(PAD.l,PAD.t); ctx.lineTo(PAD.l,H-PAD.b); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(PAD.l,H-PAD.b); ctx.lineTo(W-PAD.r,H-PAD.b); ctx.stroke();

  ctx.fillStyle=C.muted; ctx.font='10px "JetBrains Mono"'; ctx.textAlign='center';
  ctx.fillText('0',sx(0),H-PAD.b+14);
  ctx.fillText(tEnd.toFixed(1)+'s',sx(tEnd),H-PAD.b+14);
  ctx.fillText('t(s)',W-PAD.r,H-PAD.b+14);
  ctx.textAlign='right';
  ctx.fillText(v0.toFixed(0),PAD.l-4,sy(v0)+4);
  ctx.fillText(vEnd.toFixed(0),PAD.l-4,sy(vEnd)+4);
  ctx.save(); ctx.translate(12,PAD.t+gH/2); ctx.rotate(-Math.PI/2);
  ctx.textAlign='center'; ctx.fillText('v(m/s)',0,0); ctx.restore();

  // 全体直線
  ctx.strokeStyle='rgba(63,185,80,0.2)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(sx(0),sy(v0)); ctx.lineTo(sx(tEnd),sy(vEnd)); ctx.stroke();

  // 軌跡
  if(trail.length>1){
    ctx.strokeStyle=C.green; ctx.lineWidth=2;
    ctx.beginPath();
    trail.forEach(({t},i)=>{
      const v=vAt(v0,t);
      if(i===0) ctx.moveTo(sx(t),sy(v)); else ctx.lineTo(sx(t),sy(v));
    });
    ctx.stroke();
  }

  if(state==='running'||state==='done'){
    ctx.beginPath(); ctx.arc(sx(animT),sy(vAt(v0,animT)),4,0,Math.PI*2);
    ctx.fillStyle=C.green; ctx.fill();
  }

  // 傾き = -g
  ctx.fillStyle=C.orange; ctx.font='600 11px "JetBrains Mono"'; ctx.textAlign='left';
  ctx.fillText('傾き = -g = -9.8 m/s²',PAD.l+6,PAD.t+16);
}

function drawAll(){ drawMain(); drawYT(); drawVT(); }

// イベント
['y0-slider','v0-slider'].forEach(id=>{
  ['input','change'].forEach(ev=>{
    document.getElementById(id).addEventListener(ev,()=>{
      document.getElementById('y0-label').textContent=parseFloat(document.getElementById('y0-slider').value).toFixed(0);
      document.getElementById('v0-label').textContent=parseFloat(document.getElementById('v0-slider').value).toFixed(1);
      if(state==='idle'||state==='done') drawAll();
    });
  });
});

['input','change'].forEach(ev=>{
  document.getElementById('speed-slider').addEventListener(ev,()=>{
    animSpeed=parseFloat(document.getElementById('speed-slider').value);
    document.getElementById('speed-label').textContent=animSpeed.toFixed(1)+'x';
  });
});

setMode('free');
drawAll();
</script>
