<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>等速円運動と単振動（正射影）| 専門物理</title>
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --bg:#f8fafc; --card:#fff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --teal:#0E7C7B; --teal-soft:#e6f2f2;
    --amber:#B8860B;
    --blue:#2980B9;
    --orange:#E67E22;
    --slate:#5D6D7E;
  }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",Meiryo,sans-serif; min-height:100vh; }
  .layout { display:grid; grid-template-columns: 1fr 300px; gap:16px; padding:16px; max-width:1400px; margin:0 auto; }
  .main { display:flex; flex-direction:column; gap:12px; min-width:0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .header h1 { font-size:18px; color:var(--teal); font-weight:700; margin-bottom:2px; }
  .header p { font-size:12px; color:var(--muted); }
  .canvas-wrap { background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; position:relative; }
  canvas { display:block; width:100%; height:520px; touch-action:none; cursor:grab; }
  canvas:active { cursor:grabbing; }
  .view-btns { position:absolute; bottom:12px; left:12px; display:flex; gap:6px; z-index:2; }
  .view-btn { background:rgba(255,255,255,0.95); border:1px solid var(--line); color:var(--text); padding:6px 12px; border-radius:6px; font-size:12px; cursor:pointer; font-weight:500; }
  .view-btn:hover { border-color:var(--teal); color:var(--teal); }
  .view-btn.active { background:var(--teal); color:#fff; border-color:var(--teal); }
  .side { display:flex; flex-direction:column; gap:12px; position:sticky; top:16px; align-self:start; max-height:calc(100vh - 32px); overflow-y:auto; }
  .panel h2 { font-size:11px; font-weight:700; color:var(--teal); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px; padding-bottom:6px; border-bottom:1px solid var(--line); }
  .row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .row:last-child { margin-bottom:0; }
  .row label { font-size:12px; color:var(--text); flex:0 0 70px; }
  .row .val { font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; min-width:38px; text-align:right; }
  input[type="range"] { flex:1; accent-color:var(--teal); }
  .btn-row { display:flex; gap:6px; }
  .btn { flex:1; background:var(--teal); color:#fff; border:none; padding:8px 10px; border-radius:6px; font-size:12px; cursor:pointer; font-weight:500; }
  .btn.secondary { background:#fff; color:var(--text); border:1px solid var(--line); }
  .btn.secondary:hover { border-color:var(--teal); color:var(--teal); }
  .btn:hover { opacity:0.9; }
  .check { display:flex; align-items:center; gap:8px; margin-bottom:7px; cursor:pointer; font-size:12px; }
  .check:last-child { margin-bottom:0; }
  .check input { width:15px; height:15px; cursor:pointer; }
  .sw { width:11px; height:11px; border-radius:2px; flex:0 0 auto; }
  .display { background:var(--teal-soft); border-radius:6px; padding:8px 10px; font-size:12px; line-height:1.7; font-variant-numeric:tabular-nums; }
  .display .v { color:var(--teal); font-weight:600; }
  .info { font-size:11px; color:var(--muted); line-height:1.5; }
  .info b { color:var(--text); }
  @media (max-width: 800px) { .layout { grid-template-columns:1fr; } .side { position:static; max-height:none; } canvas { height:60vh; } }
</style>
</head>
<body>
<div class="layout">
  <div class="main">
    <div class="card header">
      <h1>等速円運動と単振動（正射影）</h1>
      <p>ドラッグで視点を回転　—　「正面」で数研図59の構図、「真横」で単振動として見える</p>
    </div>
    <div class="canvas-wrap">
      <canvas id="cv"></canvas>
      <div class="view-btns">
        <button class="view-btn" id="btn-front">正面（円運動＋正弦曲線）</button>
        <button class="view-btn" id="btn-side">真横（単振動）</button>
        <button class="view-btn active" id="btn-persp">斜め</button>
      </div>
    </div>
  </div>
  <aside class="side">
    <div class="card panel">
      <h2>再生</h2>
      <div class="btn-row">
        <button class="btn" id="btn-play">一時停止</button>
        <button class="btn secondary" id="btn-reset">リセット</button>
      </div>
    </div>
    <div class="card panel">
      <h2>パラメータ</h2>
      <div class="row"><label>角振動数 ω</label><input type="range" id="sl-omega" min="0.3" max="2.5" step="0.05" value="1.0"><span class="val" id="v-omega">1.00</span></div>
      <div class="row"><label>振幅 A</label><input type="range" id="sl-A" min="1.0" max="3.0" step="0.1" value="2.0"><span class="val" id="v-A">2.0</span></div>
    </div>
    <div class="card panel">
      <h2>表示切り替え</h2>
      <label class="check"><input type="checkbox" id="ck-shadow" checked><span class="sw" style="background:var(--amber)"></span>影 Q（単振動）</label>
      <label class="check"><input type="checkbox" id="ck-trace" checked><span class="sw" style="background:var(--amber)"></span>影の軌跡（正弦曲線）</label>
      <label class="check"><input type="checkbox" id="ck-vel"><span class="sw" style="background:var(--blue)"></span>速度ベクトル</label>
      <label class="check"><input type="checkbox" id="ck-acc"><span class="sw" style="background:var(--orange)"></span>加速度ベクトル</label>
      <label class="check"><input type="checkbox" id="ck-proj" checked><span class="sw" style="background:#aaa"></span>影への投影線</label>
    </div>
    <div class="card panel">
      <h2>現在の値</h2>
      <div class="display">
        位置 y = <span class="v" id="d-x">0.00</span><br>
        速度 v = <span class="v" id="d-v">0.00</span><br>
        加速度 a = <span class="v" id="d-a">0.00</span><br>
        周期 T = <span class="v" id="d-T">6.28</span>
      </div>
    </div>
    <div class="card panel">
      <h2>ポイント</h2>
      <div class="info">
        円周上の点 <b>P</b> が等速円運動し、そのy成分（正射影）<b>Q</b> が単振動する。<br><br>
        <b>正面ビュー</b>：円と正弦曲線が並んで見える（数研図59の構図）<br>
        <b>真横ビュー</b>：円が縦線に潰れ、Pの上下運動＝単振動として見える<br><br>
        2つは<b>同じ運動の別の見え方</b>。
      </div>
    </div>
  </aside>
</div>
<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  
  // === 座標系 ===
  // 円は x-y 平面（z=0）、中心O、半径 A
  //   点 P = (A cosθ, A sinθ, 0)、θ = ωt
  // 影 Q は円の右横 (x=TRACE_START_X, y=y_P, z=0)  ← y成分を取った正射影
  // 時間軸は x方向に伸びる、正弦曲線 y(τ) = A sin(ω τ) を描く
  //
  // 正面ビュー：z軸(+z)から見る、ortho → 円が丸く見え、正弦曲線が右に伸びる（数研図59）
  // 真横ビュー：x軸(+x)から見る、ortho → 円が縦線に、Pは上下運動、正弦曲線は奥方向に消える
  // 斜め：透視、少し上・少し横から
  
  const TRACE_START_X = 3.2;
  const TRACE_LEN = 5.5;
  const CAM_DIST = 12;
  const FOV = 460;
  
  const state = {
    omega: 1.0, A: 2.0, t: 0, playing: true,
    yaw: -0.5, pitch: 0.4, proj: 'persp',
    show: { shadow:true, trace:true, vel:false, acc:false, proj:true },
  };
  
  function project(x, y, z) {
    const cy = Math.cos(state.yaw), sy = Math.sin(state.yaw);
    const cp = Math.cos(state.pitch), sp = Math.sin(state.pitch);
    const xr = x * cy - z * sy;
    const zr = x * sy + z * cy;
    const yr = y * cp - zr * sp;
    const zr2 = y * sp + zr * cp;
    const dpr = window.devicePixelRatio || 1;
    const cw = cv.width / dpr, ch = cv.height / dpr;
    if (state.proj === 'ortho') {
      const scale = FOV / CAM_DIST;
      return { sx: cw * 0.5 + xr * scale, sy: ch * 0.5 - yr * scale, depth: CAM_DIST };
    }
    const cameraZ = CAM_DIST - zr2;
    if (cameraZ <= 0.01) return null;
    const scale = FOV / cameraZ;
    return { sx: cw * 0.5 + xr * scale, sy: ch * 0.5 - yr * scale, depth: cameraZ };
  }
  
  function drawLine3D(p1, p2, color, w=2, dash=null) {
    const a = project(p1[0], p1[1], p1[2]);
    const b = project(p2[0], p2[1], p2[2]);
    if (!a || !b) return;
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = w;
    if (dash) ctx.setLineDash(dash);
    ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.stroke();
    ctx.restore();
  }
  function drawPolyline3D(pts, color, w=2) {
    ctx.save();
    ctx.strokeStyle = color; ctx.lineWidth = w;
    ctx.beginPath();
    let first = true;
    for (const p of pts) {
      const q = project(p[0], p[1], p[2]);
      if (!q) continue;
      if (first) { ctx.moveTo(q.sx, q.sy); first = false; }
      else ctx.lineTo(q.sx, q.sy);
    }
    ctx.stroke();
    ctx.restore();
  }
  function drawSphere3D(pos, radius, color) {
    const p = project(pos[0], pos[1], pos[2]);
    if (!p) return;
    const r = radius * (FOV / p.depth);
    ctx.save();
    const grad = ctx.createRadialGradient(p.sx - r*0.3, p.sy - r*0.3, r*0.1, p.sx, p.sy, r);
    grad.addColorStop(0, lighten(color, 0.4));
    grad.addColorStop(1, color);
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(p.sx, p.sy, r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  function lighten(hex, amt) {
    const h = hex.replace('#', '');
    const r = Math.min(255, parseInt(h.substr(0,2),16) + amt*255);
    const g = Math.min(255, parseInt(h.substr(2,2),16) + amt*255);
    const b = Math.min(255, parseInt(h.substr(4,2),16) + amt*255);
    return `rgb(${r|0},${g|0},${b|0})`;
  }
  function drawArrow3D(from, to, color) {
    const a = project(from[0], from[1], from[2]);
    const b = project(to[0], to[1], to[2]);
    if (!a || !b) return;
    const dx = b.sx - a.sx, dy = b.sy - a.sy;
    if (Math.hypot(dx, dy) < 1) return;
    ctx.save();
    ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.stroke();
    const hs = 12; const ang = Math.atan2(dy, dx);
    ctx.beginPath();
    ctx.moveTo(b.sx, b.sy);
    ctx.lineTo(b.sx - hs * Math.cos(ang - 0.35), b.sy - hs * Math.sin(ang - 0.35));
    ctx.lineTo(b.sx - hs * Math.cos(ang + 0.35), b.sy - hs * Math.sin(ang + 0.35));
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  
  function drawCircle() {
    const pts = [];
    const seg = 96;
    for (let i = 0; i <= seg; i++) {
      const a = (i / seg) * Math.PI * 2;
      pts.push([state.A * Math.cos(a), state.A * Math.sin(a), 0]);
    }
    drawPolyline3D(pts, '#B0B7BF', 1.5);
    drawSphere3D([0, 0, 0], 0.06, '#5D6D7E');
  }
  function drawTimeAxis() {
    drawLine3D([TRACE_START_X, 0, 0], [TRACE_START_X + TRACE_LEN, 0, 0], '#C5CFD8', 1);
    drawLine3D([TRACE_START_X, -state.A - 0.3, 0], [TRACE_START_X, state.A + 0.3, 0], '#C5CFD8', 1);
  }
  function drawTrace(t, w, A) {
    const TRACE_SPAN = 4 * Math.PI / w;
    const seg = 200;
    const pts = [];
    for (let i = 0; i <= seg; i++) {
      const p = i / seg;
      const tau = t - p * TRACE_SPAN;
      const xPos = TRACE_START_X + p * TRACE_LEN;
      const yPos = A * Math.sin(w * tau);
      pts.push([xPos, yPos, 0]);
    }
    drawPolyline3D(pts, '#B8860B', 2);
  }
  
  // ドラッグ
  let dragging = false, lastX = 0, lastY = 0;
  cv.addEventListener('pointerdown', (e) => {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    cv.setPointerCapture(e.pointerId);
    clearActiveViewBtn();
    state.proj = 'persp';
  });
  cv.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    state.yaw += dx * 0.008;
    state.pitch += dy * 0.008;
    state.pitch = Math.max(-1.3, Math.min(1.3, state.pitch));
  });
  cv.addEventListener('pointerup', () => { dragging = false; });
  cv.addEventListener('pointercancel', () => { dragging = false; });
  function clearActiveViewBtn() {
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  }
  
  function animateView(targetYaw, targetPitch, targetProj) {
    const startYaw = state.yaw, startPitch = state.pitch;
    let dyaw = targetYaw - startYaw;
    while (dyaw > Math.PI) dyaw -= 2 * Math.PI;
    while (dyaw < -Math.PI) dyaw += 2 * Math.PI;
    state.proj = targetProj; // すぐ切替（アニメ中でも自然)
    const t0 = performance.now();
    const dur = 600;
    function step() {
      const p = Math.min(1, (performance.now() - t0) / dur);
      const e = p < 0.5 ? 2*p*p : 1 - (2-2*p)*(2-2*p)/2;
      state.yaw = startYaw + dyaw * e;
      state.pitch = startPitch + (targetPitch - startPitch) * e;
      if (p < 1) requestAnimationFrame(step);
    }
    step();
  }
  
  // 正面：z軸から見る、円が丸く見える → 数研図59の構図
  document.getElementById('btn-front').onclick = () => {
    clearActiveViewBtn();
    document.getElementById('btn-front').classList.add('active');
    animateView(0, 0, 'ortho');
  };
  // 真横：x軸から見る、円は縦線、Pは上下運動
  document.getElementById('btn-side').onclick = () => {
    clearActiveViewBtn();
    document.getElementById('btn-side').classList.add('active');
    animateView(Math.PI / 2, 0, 'ortho');
  };
  document.getElementById('btn-persp').onclick = () => {
    clearActiveViewBtn();
    document.getElementById('btn-persp').classList.add('active');
    animateView(-0.5, 0.4, 'persp');
  };
  
  // UI
  const btnPlay = document.getElementById('btn-play');
  const btnReset = document.getElementById('btn-reset');
  const slOmega = document.getElementById('sl-omega');
  const slA = document.getElementById('sl-A');
  const vOmega = document.getElementById('v-omega');
  const vA = document.getElementById('v-A');
  btnPlay.onclick = () => {
    state.playing = !state.playing;
    btnPlay.textContent = state.playing ? '一時停止' : '再生';
  };
  btnReset.onclick = () => { state.t = 0; };
  slOmega.oninput = () => { state.omega = parseFloat(slOmega.value); vOmega.textContent = state.omega.toFixed(2); };
  slA.oninput = () => { state.A = parseFloat(slA.value); vA.textContent = state.A.toFixed(1); };
  ['shadow','trace','vel','acc','proj'].forEach(k => {
    document.getElementById('ck-' + k).onchange = (e) => { state.show[k] = e.target.checked; };
  });
  
  function resize() {
    const rect = cv.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    cv.width = rect.width * dpr;
    cv.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();
  
  let last = performance.now();
  function loop() {
    const now = performance.now();
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (state.playing) state.t += dt;
    
    const w = state.omega, A = state.A, t = state.t;
    const theta = w * t;
    const xP = A * Math.cos(theta);
    const yP = A * Math.sin(theta);
    const yQ = yP;
    const vy = A * w * Math.cos(theta);
    const ay = -A * w * w * Math.sin(theta);
    
    const dpr = window.devicePixelRatio || 1;
    const dw = cv.width / dpr, dh = cv.height / dpr;
    ctx.clearRect(0, 0, dw, dh);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, dw, dh);
    
    drawCircle();
    drawTimeAxis();
    if (state.show.trace) drawTrace(t, w, A);
    
    if (state.show.proj && state.show.shadow) {
      drawLine3D([xP, yP, 0], [TRACE_START_X, yQ, 0], 'rgba(160,160,160,0.7)', 1, [4, 3]);
    }
    drawLine3D([0, 0, 0], [xP, yP, 0], '#0E7C7B', 2);
    if (state.show.shadow) drawSphere3D([TRACE_START_X, yQ, 0], 0.14, '#B8860B');
    if (state.show.vel && state.show.shadow) {
      drawArrow3D([TRACE_START_X, yQ, 0], [TRACE_START_X, yQ + vy * 0.4, 0], '#2980B9');
    }
    if (state.show.acc && state.show.shadow) {
      drawArrow3D([TRACE_START_X, yQ, 0], [TRACE_START_X, yQ + ay * 0.3, 0], '#E67E22');
    }
    drawSphere3D([xP, yP, 0], 0.16, '#0E7C7B');
    
    document.getElementById('d-x').textContent = yQ.toFixed(2);
    document.getElementById('d-v').textContent = vy.toFixed(2);
    document.getElementById('d-a').textContent = ay.toFixed(2);
    document.getElementById('d-T').textContent = (2 * Math.PI / w).toFixed(2);
    
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
